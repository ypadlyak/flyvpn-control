services:
  flyvpn-control:
    build: .
    # Or, once you've pushed an image:  image: yourname/flyvpn-control:latest
    container_name: flyvpn-control
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      FLY_API_TOKEN: "${FLY_API_TOKEN}"
      FLY_ORG: "${FLY_ORG:-personal}"
      TS_OAUTH_CLIENT_ID: "${TS_OAUTH_CLIENT_ID}"
      TS_OAUTH_CLIENT_SECRET: "${TS_OAUTH_CLIENT_SECRET}"
      # Legacy fallback (expires after <= 90 days), used only without OAuth:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY:-}"
      # Optional Telegram bot:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_IDS: "${TELEGRAM_ALLOWED_IDS:-}"
      # Optional tuning:
      VM_MEMORY: "${VM_MEMORY:-512}"
      # TS_LOGIN_SERVER: "https://headscale.example.com"   # self-hosted only
    volumes:
      - ./data:/data
